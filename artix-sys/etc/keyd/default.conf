# keyd: capslock/esc swap and alt+j/k tab switching.
#
# Installed to /etc/keyd/default.conf by bootstrap.sh (artix-sys/etc -> /etc).
# A plain file rather than a symlink into the repo, so the boot path does not
# depend on /home. Applications that want vim bring their own (Vimium,
# VSCodeVim, IdeaVim, zsh's bindkey -v, Obsidian).

[ids]
*

[main]
capslock = esc
esc = capslock

# Alt+J / Alt+K are next/previous tab everywhere - Ctrl+PageDown / PageUp, which
# is what a browser wants. The alt is dropped rather than re-emitted: a binding
# inside a modifier layer does not inherit that layer's modifier.
[alt]
j = C-pagedown
k = C-pageup

# Ctrl+Alt+H / Ctrl+Alt+L send Ctrl+Alt+Left / Right, the chord editors and
# browsers use for previous/next editor group. Unlike the layer above, this one
# has to write the modifiers out, since they are the point of the binding.
[control+alt]
h = C-A-left
l = C-A-right
