# keyd: capslock <-> esc, nothing else.
#
# Deployed to /etc/keyd/default.conf by bootstrap.sh (artix-sys/etc -> /etc).
# This used to be a symlink flipped between a vim-mode and a normal-mode config
# by a toggle script; both are gone, along with the per-application mapper.
# Applications that want vim now bring their own (Vimium, VSCodeVim, IdeaVim,
# zsh's bindkey -v, Obsidian's vim mode).

[ids]
*

[main]
capslock = esc
esc = capslock
